name: Deploy to Droplet

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - init-db.sh
      - monitoring/**
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy stack to droplet
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.yml,init-db.sh,keycloak-setup.sh,monitoring/"
          target: /opt/ci-platform

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD:       ${{ secrets.RABBITMQ_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          GRAFANA_PASSWORD:        ${{ secrets.GRAFANA_PASSWORD }}
          OPENBAO_ROOT_TOKEN:      ${{ secrets.OPENBAO_ROOT_TOKEN }}
          GHCR_TOKEN:              ${{ secrets.PACKAGES_TOKEN }}
          GHCR_USER:               MaciejMajchrzak
          BAGET_API_KEY:           ${{ secrets.BAGET_API_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: POSTGRES_PASSWORD,RABBITMQ_PASSWORD,KEYCLOAK_ADMIN_PASSWORD,GRAFANA_PASSWORD,OPENBAO_ROOT_TOKEN,GHCR_TOKEN,GHCR_USER,BAGET_API_KEY
          script: |
            set -e
            cd /opt/ci-platform

            # Write .env from secrets (never stored in repo)
            cat > .env << EOF
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
            OPENBAO_ROOT_TOKEN=${OPENBAO_ROOT_TOKEN}
            BAGET_API_KEY=${BAGET_API_KEY}
            EOF

            # Make init script executable
            chmod +x init-db.sh

            # Login to GHCR so docker can pull private images
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Wipe current state including postgres volume so init-db.sh always runs clean
            docker compose down --volumes --remove-orphans || true

            # Pull latest images — services with no image yet are skipped gracefully
            docker compose pull --ignore-pull-failures

            # Start infrastructure + services whose images exist; skip those still missing
            docker compose up -d --remove-orphans || true

            # Ensure infra is up even if app services failed
            docker compose up -d postgres valkey rabbitmq keycloak seaweedfs-master seaweedfs-volume seaweedfs-filer openbao jaeger prometheus grafana

            # Run Keycloak setup (creates realm, client, mapper, test user)
            chmod +x keycloak-setup.sh
            KC_URL=http://localhost:8080 \
            KC_ADMIN=admin \
            KC_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD} \
            bash keycloak-setup.sh

            # Show running services
            docker compose ps
