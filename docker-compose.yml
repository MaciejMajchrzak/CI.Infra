services:

  # ── Infrastructure ──────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    container_name: ci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ci_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ci-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ci-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ci
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ci-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ci_keycloak
      KC_DB_USERNAME: ci
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "http://keycloak:8080"
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.71
    container_name: ci-seaweedfs-master
    ports:
      - "9333:9333"
      - "19333:19333"
    command: master -mdir=/data
    volumes:
      - seaweedfs_master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.71
    container_name: ci-seaweedfs-volume
    ports:
      - "8333:8333"
    command: volume -mserver=seaweedfs-master:9333 -port=8333 -dir=/data
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.71
    container_name: ci-seaweedfs-filer
    ports:
      - "8888:8888"
    command: filer -master=seaweedfs-master:9333
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  openbao:
    image: openbao/openbao:2.0
    container_name: ci-openbao
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: server -dev
    cap_add:
      - IPC_LOCK

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: ci-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ci-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ci-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

  # ── Platform Services (images from GHCR, no local build) ────────────────

  ci-platform-tenants:
    image: ghcr.io/maciejmajchrzak/ci-platform-tenants:latest
    container_name: ci-platform-tenants
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Tenants: Host=postgres;Database=ci_tenants;Username=ci;Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ci
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Keycloak__Authority: http://keycloak:8080/realms/ci-platform
      Keycloak__Audience: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ci-platform-users:
    image: ghcr.io/maciejmajchrzak/ci-platform-users:latest
    container_name: ci-platform-users
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Users: Host=postgres;Database=ci_users;Username=ci;Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ci
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Keycloak__Authority: http://keycloak:8080/realms/ci-platform
      Keycloak__Audience: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ci-platform-gateway:
    image: ghcr.io/maciejmajchrzak/ci-platform-gateway:latest
    container_name: ci-platform-gateway
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: http://keycloak:8080/realms/ci-platform
      Keycloak__Audience: account
      Services__Users: http://ci-platform-users:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      ReverseProxy__Clusters__ci-platform-tenants__Destinations__default__Address: http://ci-platform-tenants:8080
      ReverseProxy__Clusters__ci-platform-users__Destinations__default__Address: http://ci-platform-users:8080
    depends_on:
      ci-platform-tenants:
        condition: service_started
      ci-platform-users:
        condition: service_started

volumes:
  postgres_data:
  seaweedfs_master:
  seaweedfs_volume:
  grafana_data:
